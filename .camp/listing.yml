name: tool_bass
summary: 'Bulk Activity Settings Selector: change the settings of some or all activities of one type in a course in one go, with a preview before anything is saved.'
description: |
  For teachers and managers who need to change the same settings across many
  activities of a course. Choose an activity type (quiz, assignment, forum, page,
  or any other), tick the activities, and tick a Change box next to each setting
  to change: every standard setting of that type's own settings form is offered,
  in the same order and sections as on the Edit settings page, including what
  other plugins add (for quizzes: Safe Exam Browser, set to a site template in
  one go). Preview shows each activity's current and new values before Apply
  changes, and each activity is saved through its own settings form, so its own
  rules and validation apply. The grade to pass can be set as a percentage of
  each activity's maximum grade. Teachers can save named configurations per
  course, and site administrators can publish admin presets.
